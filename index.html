<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student - ClubGear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  
    :root {
        --bg-canvas: #F5F7FA;     
        --surface: #FFFFFF;        
        --primary: #007EE5;        
        --primary-hover: #005BB5;
        --text-dark: #1F2937;
        --text-muted: #6B7280;
        --radius: 16px;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--bg-canvas);
        color: var(--text-dark);
        padding: 40px 20px;
        margin: 0;
        line-height: 1.5;
    }

    h1, h2, h3 {
        color: var(--text-dark);
        text-align: center;
        margin-bottom: 30px;
    }

   
    .grid-container {
        display: grid;
     
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
        gap: 24px;
        max-width: 1200px;
        margin: 0 auto;
    }

   
    .card {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
        display: flex;
        flex-direction: column; 
        height: 100%; 
        box-sizing: border-box;
        transition: transform 0.2s ease;
    }

    .card:hover {
        transform: translateY(-4px); /* Slight lift on hover */
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

   
    .card-image-placeholder {
        width: 100%;
        height: 180px;
        border-radius: 12px;
        margin-bottom: 16px;
        object-fit: cover;
    }

    .card h3 {
        text-align: left;
        margin: 0 0 8px 0;
        font-size: 1.25rem;
    }

    .card p {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin: 4px 0;
    }

   
    .card button {
        margin-top: auto; 
    }

  
    .admin-form-container {
        background: var(--surface);
        padding: 30px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        max-width: 500px;
        margin: 0 auto 40px auto;
        display: flex;
        flex-direction: column;
        gap: 16px; 
    }

   
    input, select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #E5E7EB;
        border-radius: 8px;
        background-color: #F9FAFB;
        font-size: 1rem;
        box-sizing: border-box;
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
        background-color: var(--surface);
    }

    button {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        width: 100%;
    }

    button:hover {
        background-color: var(--primary-hover);
    }

    /* buttons */
    .action-btn {
        width: auto;
        padding: 8px 16px;
        font-size: 0.9rem;
        margin-right: 8px;
    }
    
    .reject-btn {
        background-color: #EF4444;
    }
    
    .reject-btn:hover {
        background-color: #DC2626;
    }
</style>

</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">ClubGear Share</span>
            <a href="admin.html" class="btn btn-outline-light btn-sm">Go to Admin Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-3">Available Lab Equipment</h2>
        <div class="grid-container" id="equipmentList">
            <p class="text-muted">Loading gear from database...</p>
        </div>

        <!-- Request History Section -->
        <h3 class="mt-5 mb-3">My Request History</h3>
        <div class="card shadow-sm border-secondary mb-5">
            <div class="card-body" id="myRequestsList">
                <p class="text-muted">Loading your requests...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        // added 'query' and 'where' 
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

       
        const firebaseConfig = {
  apiKey: "AIzaSyCdRRPDwaWuzRO84bdASyAxthzTaN-cYcM",
  authDomain: "clubgear-5b056.firebaseapp.com",
  projectId: "clubgear-5b056",
  storageBucket: "clubgear-5b056.firebasestorage.app",
  messagingSenderId: "752676917301",
  appId: "1:752676917301:web:ec1df798d538f1a218617c"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentUserEmail = "student@college.edu"; //for  prototype

        // Send Request & Lock 
        window.requestBooking = async function(itemName, equipmentId) {
            alert("Sending request to admin for " + itemName + "...");
            try {
                await addDoc(collection(db, "bookings"), {
                    item_name: itemName,
                    equipment_id: equipmentId,
                    borrower_email: currentUserEmail,
                    status: "pending",
                    request_date: new Date().toLocaleDateString()
                });

                const equipmentRef = doc(db, "equipment", equipmentId);
                await updateDoc(equipmentRef, { status: "Pending Approval" });

                alert("Success! Your request is pending admin approval.");
                
                loadEquipment(); 
                loadMyRequests(); // Refresh

            } catch (error) {
                console.error("Error processing request: ", error);
                alert("Failed to send request.");
            }
        };

        // Gallery
        async function loadEquipment() {
            const equipmentDiv = document.getElementById('equipmentList');
            try {
                const querySnapshot = await getDocs(collection(db, "equipment"));
                equipmentDiv.innerHTML = ""; 

                querySnapshot.forEach((document) => {
                    const item = document.data();
                    const equipmentId = document.id; 
                    
                    if(item.status.toLowerCase() === 'available') {
                
                        
        const hasRealImage = item.image_url && !item.image_url.includes('placehold.co');

        const cardHtml = `
            <div class="card">
                ${hasRealImage 
                    ? `<img src="${item.image_url}" class="card-image-placeholder" alt="${item.name}">`
                    : `<div class="card-image-placeholder" style="background: linear-gradient(135deg, #e0e7ff, #c7d2fe); display:flex; align-items:center; justify-content:center; font-size: 3rem; margin-bottom: 16px; min-height: 180px; width: 100%; border-radius: 12px; box-sizing: border-box;">📦</div>`
                }
                
                <h3>${item.name}</h3>
                <p>Owner: ${item.owner}</p>
                <p>Status: <strong>${item.status}</strong></p>
                
                <button onclick="requestBooking('${item.name}', '${equipmentId}')">Request Booking</button>
            </div>
        `;
                        
            
                        equipmentDiv.innerHTML += cardHtml;
                    }
                });
            } catch (error) {
                console.error("Error loading equipment: ", error);
                equipmentDiv.innerHTML = "<p class='text-danger'>Failed to load equipment.</p>";
            }
        }
        

        //History
        async function loadMyRequests() {
            const historyDiv = document.getElementById('myRequestsList');
            try {
            
                const q = query(collection(db, "bookings"), where("borrower_email", "==", currentUserEmail));
                const querySnapshot = await getDocs(q);
                
                historyDiv.innerHTML = ""; 
                let hasRequests = false;

                querySnapshot.forEach((document) => {
                    hasRequests = true;
                    const req = document.data();
                    let badgeColor = "bg-secondary";
                    
                    // colors based status
                    if(req.status === "pending") badgeColor = "bg-warning text-dark";
                    if(req.status === "approved") badgeColor = "bg-success";
                    if(req.status === "rejected") badgeColor = "bg-danger";
                    if(req.status === "returned") badgeColor = "bg-info text-dark";

                    const reqHtml = `
                    <div class="d-flex justify-content-between border-bottom py-2">
                        <span><strong>${req.item_name}</strong> <small class="text-muted">(${req.request_date})</small></span>
                        <span class="badge ${badgeColor}">${req.status.toUpperCase()}</span>
                    </div>
                    `;
                    historyDiv.innerHTML += reqHtml;
                });

                if (!hasRequests) {
                    historyDiv.innerHTML = "<p class='text-muted mb-0'>You haven't requested any items yet.</p>";
                }
            } catch (error) {
                console.error("Error loading history: ", error);
                historyDiv.innerHTML = "<p class='text-danger'>Failed to load request history.</p>";
            }
        }

    
        loadEquipment();
        loadMyRequests();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ClubGear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
   
    :root {
        --bg-canvas: #F5F7FA;     
        --surface: #FFFFFF;        
        --primary: #007EE5;        
        --primary-hover: #005BB5;
        --text-dark: #1F2937;
        --text-muted: #6B7280;
        --radius: 16px;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--bg-canvas);
        color: var(--text-dark);
        padding: 40px 20px;
        margin: 0;
        line-height: 1.5;
    }

    h1, h2, h3 {
        color: var(--text-dark);
        text-align: center;
        margin-bottom: 30px;
    }

    
    .grid-container {
        display: grid;
        
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
        gap: 24px;
        max-width: 1200px;
        margin: 0 auto;
    }

  
    .card {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100%; 
        box-sizing: border-box;
        transition: transform 0.2s ease;
    }

    .card:hover {
        transform: translateY(-4px); 
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

   
    .card-image-placeholder {
        width: 100%;
        height: 180px;
        border-radius: 12px;
        margin-bottom: 16px;
        object-fit: cover;
    }

    .card h3 {
        text-align: left;
        margin: 0 0 8px 0;
        font-size: 1.25rem;
    }

    .card p {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin: 4px 0;
    }

    
    .card button {
        margin-top: auto; 
    }

    
    .admin-form-container {
        background: var(--surface);
        padding: 30px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        max-width: 500px;
        margin: 0 auto 40px auto;
        display: flex;
        flex-direction: column; 
        gap: 16px;
    }

    
    input, select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #E5E7EB;
        border-radius: 8px;
        background-color: #F9FAFB;
        font-size: 1rem;
        box-sizing: border-box;
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
        background-color: var(--surface);
    }

    button {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        width: 100%;
    }

    button:hover {
        background-color: var(--primary-hover);
    }

   
    .action-btn {
        width: auto;
        padding: 8px 16px;
        font-size: 0.9rem;
        margin-right: 8px;
    }
    
    .reject-btn {
        background-color: #EF4444;
    }
    
    .reject-btn:hover {
        background-color: #DC2626;
    }
</style>
   
    
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-danger mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">⚙️ ClubGear Admin Dashboard</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">Switch to Student View</a>
        </div>
    </nav>
    <script>
        const adminPin = prompt("Admin Security Gate. (Judges, enter PIN: 0000)");
        if (adminPin !== "0000") { 
            alert("Incorrect PIN. Returning to Student View.");
            window.location.href = "index.html"; 
        }
    </script>
</head>
<body>

    <div class="container">
        
        <!-- Add Equipment Form -->
        <div class="card shadow-sm border-success mb-5">
            <div class="card-header bg-success text-white fw-bold">
                ➕ Add New Club Equipment
            </div>
            <div class="card-body">
               <form id="addItemForm" onsubmit="event.preventDefault(); addNewItem();" class="admin-form-container">
    <input type="text" id="newItemName" placeholder="Item Name (e.g., Multimeter)">
    <input type="text" id="newItemOwner" placeholder="Owning Club (e.g., Physics Dept)">
    <input type="url" id="newItemImage" placeholder="Image URL (Optional)">
    <button type="submit">Upload</button>
</form>
            </div>
        </div>

        <h2 class="mb-3">Pending Booking Requests</h2>
        <div class="card shadow-sm border-danger">
            <div class="card-body" id="pendingRequests">
                <p class="text-muted">Loading requests from database...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        //  new inventory
        import { getFirestore, collection, getDocs, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

    
       const firebaseConfig = {
  apiKey: "AIzaSyCdRRPDwaWuzRO84bdASyAxthzTaN-cYcM",
  authDomain: "clubgear-5b056.firebaseapp.com",
  projectId: "clubgear-5b056",
  storageBucket: "clubgear-5b056.firebasestorage.app",
  messagingSenderId: "752676917301",
  appId: "1:752676917301:web:ec1df798d538f1a218617c"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

       
        window.addNewItem = async function() {
            const name = document.getElementById('newItemName').value;
            const owner = document.getElementById('newItemOwner').value;
            let image = document.getElementById('newItemImage').value;

            //  default 
            if (!image) {
                image = "https://placehold.co/600x400/eeeeee/000000?text=New+Item";
            }

            try {
                await addDoc(collection(db, "equipment"), {
                    name: name,
                    owner: owner,
                    image_url: image,
                    status: "Available"
                });
                alert("Success! The item is now live in the student gallery.");
                document.getElementById('addItemForm').reset(); // Clear
            } catch (error) {
                console.error("Error adding item: ", error);
                alert("Failed to upload item.");
            }
        };

        // Approve
        window.approveBooking = async function(bookingId, equipmentId) {
            try {
                const bookingRef = doc(db, "bookings", bookingId);
                await updateDoc(bookingRef, { status: "approved" });
                
                if(equipmentId) {
                    const equipmentRef = doc(db, "equipment", equipmentId);
                    await updateDoc(equipmentRef, { status: "Checked-Out" });
                }
                alert("Success! Booking approved.");
                loadRequests(); 
            } catch (error) {
                console.error("Error: ", error);
            }
        };

        // Reject 
        window.rejectBooking = async function(bookingId, equipmentId) {
            try {
                const bookingRef = doc(db, "bookings", bookingId);
                await updateDoc(bookingRef, { status: "rejected" });
                
                if(equipmentId) {
                    const equipmentRef = doc(db, "equipment", equipmentId);
                    await updateDoc(equipmentRef, { status: "Available" });
                }
                alert("Request rejected. Item is available for others again.");
                loadRequests(); 
            } catch (error) {
                console.error("Error: ", error);
            }
        };

        // Return 
        window.returnItem = async function(bookingId, equipmentId) {
            try {
                const bookingRef = doc(db, "bookings", bookingId);
                await updateDoc(bookingRef, { status: "returned" });
                
                if(equipmentId) {
                    const equipmentRef = doc(db, "equipment", equipmentId);
                    await updateDoc(equipmentRef, { status: "Available" });
                }
                alert("Success! Item returned.");
                loadRequests(); 
            } catch (error) {
                console.error("Error: ", error);
            }
        };

       
        async function loadRequests() {
            const adminDiv = document.getElementById('pendingRequests');
            adminDiv.innerHTML = "Checking database...";
            
            try {
                const querySnapshot = await getDocs(collection(db, "bookings"));
                adminDiv.innerHTML = ""; 
                let hasRequests = false;

                querySnapshot.forEach((document) => {
                    const req = document.data();
                    const documentId = document.id; 
                    
                    if (req.status === 'pending') {
                        hasRequests = true;
                        adminDiv.innerHTML += `
                        <div class="alert alert-warning d-flex justify-content-between align-items-center">
                            <div>
                                <strong>[PENDING] ${req.item_name}</strong> <br>
                                <small>Requested by: ${req.borrower_email}</small>
                            </div>
                            <div>
                                <button class="btn btn-success btn-sm me-2" onclick="approveBooking('${documentId}', '${req.equipment_id}')">Approve</button>
                                <button class="btn btn-danger btn-sm" onclick="rejectBooking('${documentId}', '${req.equipment_id}')">Reject</button>
                            </div>
                        </div>
                        `;
                    }
                    
                    if (req.status === 'approved') {
                        hasRequests = true;
                        adminDiv.innerHTML += `
                        <div class="alert alert-info d-flex justify-content-between align-items-center">
                            <div>
                                <strong>[CHECKED-OUT] ${req.item_name}</strong> <br>
                                <small>Currently held by: ${req.borrower_email}</small>
                            </div>
                            <button class="btn btn-primary btn-sm" onclick="returnItem('${documentId}', '${req.equipment_id}')">Mark as Returned</button>
                        </div>
                        `;
                    }
                });

                if (!hasRequests) {
                    adminDiv.innerHTML = "<p class='text-muted'>No active requests right now.</p>";
                }
            } catch (error) {
                adminDiv.innerHTML = "<p class='text-danger'>Failed to load data.</p>";
            }
        }

        loadRequests();
    </script>
</body>
</html>
